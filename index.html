<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LectureLens — one lecture in, four study tools out</title>
<meta name="description" content="Upload a lecture and get structured notes, flashcards, a quiz, and a mind map — all from that one recording.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-name">LectureLens</span><span class="brand-mark">v1.0</span></div>
    <div>
      <h4>Your lectures</h4>
      <ul class="lecture-list" id="lecture-list"></ul>
    </div>
    <div class="sidebar-foot">
      <p>Notes, flashcards, a quiz, and a mind map from one lecture. Everything is generated from the lecture itself — check it against the transcript.</p>
      <button class="btn btn-ghost btn-block btn-small" id="btn-home">+ New lecture</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script src="js/logic.js"></script>
<script src="js/sample.js"></script>
<script src="js/gemini.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById("btn-home").addEventListener("click", function () {
    localStorage.removeItem("ll_current");
    location.reload();
  });
</script>
</body>
</html>
